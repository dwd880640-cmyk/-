name: download
on:
  workflow_dispatch:
    inputs:
      video_id:
        required: true
      upload_url:
        required: true
      audio:
        description: 'audio only (true = mp3)'
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U --pre "yt-dlp[default]" yt-dlp-ejs requests
      - name: Download and upload
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          UPLOAD_URL: ${{ inputs.upload_url }}
          AUDIO: ${{ inputs.audio }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          echo "::add-mask::$UPLOAD_URL"
          printf '%s\n' "$YT_COOKIES" > cookies.txt
          if [ ! -s cookies.txt ] || [ "$(wc -l < cookies.txt)" -lt 3 ]; then
            echo "ERROR: cookies.txt is empty - check the YT_COOKIES secret"
            exit 1
          fi
          yt-dlp --version
          deno --version
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed"; sleep $((i*20)); done; return 1; }
          if [ "$AUDIO" = "true" ]; then
            export FILE=audio.mp3
            retry yt-dlp --cookies cookies.txt --no-playlist --retries 10 \
              --abort-on-unavailable-fragments \
              --js-runtimes deno --remote-components ejs:github \
              -f "ba/b" -x --audio-format mp3 --audio-quality 0 \
              -o "audio.%(ext)s" \
              "https://www.youtube.com/watch?v=$VIDEO_ID"
          else
            export FILE=video.mp4
            retry yt-dlp --cookies cookies.txt --no-playlist --retries 10 \
              --abort-on-unavailable-fragments \
              --js-runtimes deno --remote-components ejs:github \
              -f "bv*[height<=720]+ba/b[height<=720]/b" \
              --merge-output-format mp4 -o video.mp4 \
              "https://www.youtube.com/watch?v=$VIDEO_ID"
          fi
          rm -f cookies.txt
          python - <<'EOF'
          import os, sys, time, requests
          url = os.environ["UPLOAD_URL"]
          path = os.environ["FILE"]
          size = os.path.getsize(path)
          CHUNK = 64 * 1024 * 1024
          with open(path, "rb") as f:
              start = 0
              while start < size:
                  data = f.read(CHUNK)
                  end = start + len(data) - 1
                  h = {"Content-Length": str(len(data)),
                       "Content-Range": f"bytes {start}-{end}/{size}"}
                  for a in range(5):
                      r = requests.put(url, data=data, headers=h)
                      if r.status_code in (200, 201, 308):
                          break
                      time.sleep(2 ** a)
                  else:
                      sys.exit(f"upload failed: {r.status_code} {r.text}")
                  start = end + 1
          EOF
