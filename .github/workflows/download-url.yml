name: download-url
run-name: ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      upload_url:
        required: true
      job_id:
        required: true
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -U yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download
        env:
          URL: ${{ inputs.url }}
        run: |
          yt-dlp --no-playlist --max-filesize 1G -f "bv*+ba/b" -o "raw.%(ext)s" "$URL"
      - name: Convert
        run: |
          f=$(ls raw.* | head -1)
          ffmpeg -y -i "$f" -map 0:v:0 -map 0:a:0? \
            -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart out.mp4
      - name: Upload
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
        run: |
          curl -fsS -X PUT -H "Content-Type: video/mp4" --data-binary @out.mp4 "$UPLOAD_URL"
